name: modustackpet

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modustackpet_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: modustack_pet
      DB_USERNAME: modustack
      DB_PASSWORD: modustack
    networks:
      - modustackpet
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: modustackpet_nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - modustackpet
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: modustackpet_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: modustack_pet
      MYSQL_USER: modustack
      MYSQL_PASSWORD: modustack
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - modustackpet_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - modustackpet

networks:
  modustackpet:
    driver: bridge

volumes:
  modustackpet_mysql: