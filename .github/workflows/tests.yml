name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, curl, zip, gd, bcmath, tokenizer, xml, ctype, openssl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction

      - name: Run tests
        run: php artisan test

      - name: Validate composer.json
        run: composer validate
